<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5C19"></stop>
      <stop offset="100%" stop-color="#FE822C"></stop>
    </linearGradient>
  </defs>

  <!-- Main Letter A -->
  <text x="70" y="125" font-size="100" font-weight="700" font-family="Poppins, Inter, Arial, sans-serif" fill="url(#grad)">
    A
  </text>

  <!-- Superscript U -->
  <text x="128" y="78" font-size="42" font-weight="600" font-family="Poppins, Inter, Arial, sans-serif" fill="currentColor">
    U
  </text>
</svg>
